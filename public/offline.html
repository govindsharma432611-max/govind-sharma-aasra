<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D0D42" />
    <title>Offline — AASRA Web Devs</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #FFFFFF;
        color: #050404;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        border: 1px solid rgba(5, 4, 4, 0.12);
        border-radius: 16px;
        padding: 36px 28px;
        text-align: center;
        background: #FFFFFF;
      }
      .mark-img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 1px solid rgba(5, 4, 4, 0.1);
        display: block;
        margin: 0 auto 18px;
        object-fit: contain;
        background: #FFFFFF;
        padding: 6px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6327FB;
        margin: 0 0 10px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.15;
        color: #1D0D42;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: rgba(5, 4, 4, 0.72);
        margin: 0 0 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      button, a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: none;
        background: #6327FB;
        color: #FFFFFF;
      }
      a {
        border: 1px solid rgba(29, 13, 66, 0.25);
        color: #1D0D42;
        background: #FFFFFF;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="./icons/icon-192.png" alt="AASRA Web Devs" class="mark-img" />
      <p class="eyebrow">AASRA Web Devs · Connection Paused</p>
      <h1>You're currently offline.</h1>
      <p>Your internet connection appears unavailable right now. Reconnect to browse live pages, portfolio studies, or submit a project enquiry.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry Connection</button>
        <a href="./">Back to Home</a>
      </div>
    </main>
  </body>
</html>
